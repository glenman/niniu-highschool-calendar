            min-height: 100vh;
            padding: 10px;
            -webkit-text-size-adjust: 100%;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow-x: hidden;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 40px; margin-bottom: 8px; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 4px; }
        .subtitle { color: #7f8c8d; font-size: 14px; margin-bottom: 12px; }
        .stats {
            display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
            background: #f8f9fa; padding: 10px 15px; border-radius: 10px;
        }
        .stats span { font-size: 13px; white-space: nowrap; }
        .stats strong { font-size: 16px; }

        /* Legend */
        .legend {
            background: #f8f9fa; padding: 12px 15px; border-radius: 10px; margin-bottom: 20px;
        }
        .legend h3 { margin-bottom: 8px; color: #2c3e50; font-size: 14px; }
        .legend-items { display: flex; flex-wrap: wrap; gap: 6px; }
        .legend-item {
            flex: 1; min-width: 140px; padding: 6px 10px; border-radius: 6px;
            border-left: 4px solid #ccc; background: white; font-size: 12px;
        }

        /* Tabs */
        .tabs { display: flex; gap: 4px; margin-bottom: 15px; }
        .tab-btn {
            flex: 1; padding: 10px 8px; border: none; background: #ecf0f1;
            border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold;
            color: #7f8c8d; transition: all 0.2s;
        }
        .tab-btn.active { background: #667eea; color: white; }

        /* Calendar Grid */
        .calendar-wrapper { margin-bottom: 20px; }
        .calendar-header {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
            margin-bottom: 2px;
        }
        .calendar-header div {
            text-align: center; padding: 6px 2px; font-weight: bold; color: #7f8c8d; font-size: 12px;
        }
        .calendar-body {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
        }
        .cal-day {
            min-height: 60px; border: 1px solid #ecf0f1; border-radius: 4px;
            padding: 2px; font-size: 10px;
        }
        .cal-day.empty { border: none; background: transparent; }
        .cal-day .day-num {
            font-weight: bold; color: #2c3e50; font-size: 11px; margin-bottom: 2px;
        }
        .cal-day .day-num.weekend { color: #e74c3c; }
        .cal-day .event-tag {
            display: block; padding: 1px 3px; border-radius: 2px; margin-bottom: 1px;
            font-size: 9px; color: white; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis;
        }
        .cal-day .event-tag.math { background: #e74c3c; }
        .cal-day .event-tag.chinese { background: #3498db; }
        .cal-day .event-tag.physics { background: #f39c12; }
        .cal-day .event-tag.chemistry { background: #9b59b6; }

        /* Weekly View */
        .weekly-section { margin-top: 15px; }
        .weekly-section h2 { color: #2c3e50; font-size: 18px; margin-bottom: 12px; text-align: center; }

        .time-block {
            margin-bottom: 16px;
        }
        .time-block-title {
            font-size: 15px; font-weight: bold; margin-bottom: 8px;
            padding: 6px 12px; border-radius: 6px; display: inline-block;
        }
        .time-block-title.morning { background: #fff3cd; color: #856404; }
        .time-block-title.afternoon { background: #d4edda; color: #155724; }
        .time-block-title.evening { background: #d1ecf1; color: #0c5460; }

        .week-group {
            background: #f8f9fa; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
        }
        .week-title {
            font-weight: bold; color: #2c3e50; font-size: 13px; margin-bottom: 8px;
            padding-bottom: 4px; border-bottom: 2px solid #ddd;
        }
        .week-table { width: 100%; border-collapse: collapse; }
        .week-table th {
            background: #2c3e50; color: white; padding: 5px 3px; font-size: 11px; text-align: center;
        }
        .week-table td {
            padding: 4px 3px; font-size: 10px; text-align: center; border-bottom: 1px solid #eee;
            vertical-align: top;
        }
        .week-table tr:last-child td { border-bottom: none; }
        .week-table .time-col { width: 50px; background: #ecf0f1; font-weight: bold; color: #555; font-size: 10px; }
        .event-cell {
            display: inline-block; padding: 2px 5px; border-radius: 3px; color: white;
            font-size: 10px; margin: 1px; white-space: nowrap;
        }
        .event-cell.math { background: #e74c3c; }
        .event-cell.chinese { background: #3498db; }
        .event-cell.physics { background: #f39c12; }
        .event-cell.chemistry { background: #9b59b6; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .footer {
            text-align: center; margin-top: 20px; padding-top: 12px;
            border-top: 1px solid #ecf0f1; color: #95a5a6; font-size: 12px;
        }
        .footer p:first-child { font-size: 14px; color: #2c3e50; margin-bottom: 4px; }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 10px; }
        }
        @media (max-width: 480px) {
            .container { padding: 10px; border-radius: 12px; }
            h1 { font-size: 20px; }
            .stats span { font-size: 11px; }
            .stats strong { font-size: 14px; }
            .cal-day { min-height: 50px; }
            .cal-day .event-tag { font-size: 8px; }
            .week-table th, .week-table td { padding: 3px 1px; font-size: 9px; }
            .week-table .time-col { width: 40px; }
            .legend-item { min-width: 120px; font-size: 11px; }
        }
    </style>
</head>

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        if (tab === 'calendar') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-calendar').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-weekly').classList.add('active');
        }
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        const firstDay = new Date(2026, 6, 1);
        const startDow = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
        const startDate = new Date(2026, 6, 1 - startDow);
        const dayMap = {};
        DATA.schedule.forEach(d => { dayMap[d.date] = d; });

        let html = '';
        for (let i = 0; i < 6 * 7; i++) {
            const d = new Date(startDate);
            d.setDate(d.getDate() + i);
            if (d.getMonth() !== 6 || d.getFullYear() !== 2026) {
                html += '<div class="cal-day empty"></div>';
                continue;
            }
            const ds = d.toISOString().slice(0, 10);
            const dayInfo = dayMap[ds];
            const isWeekend = d.getDay() === 0 || d.getDay() === 6;
            html += '<div class="cal-day">';
            html += `<div class="day-num${isWeekend ? ' weekend' : ''}">${d.getDate()}日 ${['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]}</div>`;
            if (dayInfo) {
                dayInfo.events.forEach(ev => {
                    const cls = ev.subject === '数学' ? 'math' : ev.subject === '语文' ? 'chinese' : ev.subject === '物理' ? 'physics' : 'chemistry';
                    html += `<span class="event-tag ${cls}">${ev.emoji} ${ev.time}</span>`;
                });
            }
            html += '</div>';
        }
        grid.innerHTML = html;
    }

    function getTimePeriod(timeStr) {
        const hour = parseInt(timeStr.split(':')[0]);
        if (hour < 12) return 'morning';
        if (hour < 18) return 'afternoon';
        return 'evening';
    }

    function renderWeekly() {
        const container = document.getElementById('weekly-container');

        // Organize by week -> time period -> day
        const weekMap = {};
        DATA.schedule.forEach(d => {
            const dt = new Date(d.date);
            const dow = dt.getDay() === 0 ? 7 : dt.getDay();
            const weekNum = Math.ceil((dt.getDate() - dow + 1) / 7);
            if (!weekMap[weekNum]) weekMap[weekNum] = { dates: [], days: {} };
            weekMap[weekNum].dates.push(d.date);
            weekMap[weekNum].days[dow] = d;
        });

        const periods = [
            { key: 'morning', label: '☀️ 上午', cls: 'morning', hours: [9, 10, 11] },
            { key: 'afternoon', label: '🌤️ 下午', cls: 'afternoon', hours: [12, 13, 14, 15, 16, 17] },
            { key: 'evening', label: '🌙 晚上', cls: 'evening', hours: [18, 19, 20, 21] },
        ];

        const weekNums = Object.keys(weekMap).sort((a,b) => a - b);
        let html = '';

        weekNums.forEach(wk => {
            const info = weekMap[wk];
            const firstDate = info.dates[0].split('-')[2];
            const lastDate = info.dates[info.dates.length - 1].split('-')[2];

            html += `<div class="week-group"><div class="week-title">第 ${wk} 周 (${firstDate}日 - ${lastDate}日)</div>`;

            periods.forEach(period => {
                // Find which subjects belong to this period
                const periodSubjects = [];
                DATA.schedule.forEach(d => {
                    d.events.forEach(ev => {
                        const p = getTimePeriod(ev.start_time);
                        if (p === period.key && !periodSubjects.includes(ev.subject)) {
                            periodSubjects.push(ev.subject);
                        }
                    });
                });

                if (periodSubjects.length > 0) {
                    html += `<div class="time-block"><div class="time-block-title ${period.cls}">${period.label}</div>`;
                    html += '<table class="week-table"><thead><tr><th class="time-col">时间</th>';
                    for (let d = 1; d <= 7; d++) {
                        const names = ['','一','二','三','四','五','六','日'];
                        html += `<th>${names[d]}${d >= 6 ? ' ⭐' : ''}</th>`;
                    }
                    html += '</tr></thead><tbody>';

                    // Sort subjects by start time within this period
                    periodSubjects.sort((a, b) => {
                        const evA = DATA.schedule.flatMap(d => d.events).find(e => e.subject === a);
                        const evB = DATA.schedule.flatMap(d => d.events).find(e => e.subject === b);
                        return evA.start_time.localeCompare(evB.start_time);
                    });

                    periodSubjects.forEach(subject => {
                        const ev = DATA.schedule.flatMap(d => d.events).find(e => e.subject === subject);
                        if (!ev) return;
                        const timeLabel = ev.time.split('-')[0];
                        const cls = subject === '数学' ? 'math' : subject === '语文' ? 'chinese' : subject === '物理' ? 'physics' : 'chemistry';
                        html += `<tr><td class="time-col">${timeLabel}</td>`;
                        for (let d = 1; d <= 7; d++) {
                            const dayData = info.days[d];
                            if (dayData) {
                                const dayEv = dayData.events.find(e => e.subject === subject);
                                if (dayEv) {
                                    html += `<td><span class="event-cell ${cls}">${dayEv.emoji} ${dayEv.time}</span></td>`;
                                } else {
                                    html += '<td></td>';
                                }
                            } else {
                                html += '<td></td>';
                            }
                        }
                        html += '</tr>';
                    });

                    html += '</tbody></table></div>';
                }
            });

            html += '</div>';
        });

        container.innerHTML = html;
    }

    function updateStats() {
        const counts = { math: 0, chinese: 0, physics: 0, chemistry: 0 };
        DATA.schedule.forEach(d => {
            d.events.forEach(e => {
                if (e.subject === '数学') counts.math++;
                else if (e.subject === '语文') counts.chinese++;
                else if (e.subject === '物理') counts.physics++;
                else if (e.subject === '化学') counts.chemistry++;
            });
        });
        document.getElementById('math-count').textContent = counts.math;
        document.getElementById('chinese-count').textContent = counts.chinese;
        document.getElementById('physics-count').textContent = counts.physics;
        document.getElementById('chem-count').textContent = counts.chemistry;
        document.getElementById('total-days').textContent = DATA.total_days;
    }

    renderCalendar();
    renderWeekly();
    updateStats();
    </script>
