    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { overflow-x: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header { text-align: center; margin-bottom: 15px; }
        .logo { font-size: 36px; margin-bottom: 4px; }
        h1 { color: #2c3e50; font-size: 22px; margin-bottom: 4px; }
        .subtitle { color: #7f8c8d; font-size: 13px; margin-bottom: 10px; }
        .stats {
            display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
            background: #f8f9fa; padding: 8px 12px; border-radius: 8px;
        }
        .stats span { font-size: 12px; white-space: nowrap; }
        .stats strong { font-size: 15px; }

        /* Tabs */
        .tabs { display: flex; gap: 4px; margin-bottom: 15px; }
        .tab-btn {
            flex: 1; padding: 8px 6px; border: none; background: #ecf0f1;
            border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: bold;
            color: #7f8c8d; transition: all 0.2s;
        }
        .tab-btn.active { background: #667eea; color: white; }

        /* ====== Monthly Calendar ====== */
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }
        .cal-grid .col-header {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: #7f8c8d;
            padding: 6px 0;
        }
        .cal-day {
            aspect-ratio: 1;
            border: 1.5px solid #e8e8e8;
            border-radius: 8px;
            padding: 3px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-height: 0;
        }
        .cal-day.empty { border: none; background: transparent; }
        .cal-day .day-label {
            font-size: 11px;
            font-weight: bold;
            color: #2c3e50;
            line-height: 1;
        }
        .cal-day .day-label.weekend { color: #e74c3c; }
        .cal-day .day-label.today {
            background: #667eea;
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cal-day .ev {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: white;
            border-radius: 3px;
            padding: 1px 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ev.math { background: #e74c3c; }
        .ev.chinese { background: #3498db; }
        .ev.physics { background: #f39c12; }
        .ev.chemistry { background: #9b59b6; }

        /* ====== Weekly Timetable ====== */
        .time-block { margin-bottom: 14px; }
        .time-block-title {
            font-size: 14px; font-weight: bold; margin-bottom: 6px; padding: 4px 10px;
            border-radius: 6px; display: inline-block;
        }
        .time-block-title.morning { background: #fff3cd; color: #856404; }
        .time-block-title.afternoon { background: #d4edda; color: #155724; }
        .time-block-title.evening { background: #d1ecf1; color: #0c5460; }

        .week-group {
            background: #f8f9fa; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
        }
        .week-title {
            font-weight: bold; color: #2c3e50; font-size: 13px; margin-bottom: 6px;
            padding-bottom: 4px; border-bottom: 2px solid #ddd;
        }
        .tt { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .tt th {
            background: #2c3e50; color: white; padding: 5px 2px; font-size: 11px; text-align: center;
        }
        .tt td {
            padding: 4px 2px; font-size: 10px; text-align: center; border-bottom: 1px solid #eee;
        }
        .tt tr:last-child td { border-bottom: none; }
        .tt .tcol { width: 55px; background: #ecf0f1; font-weight: bold; color: #555; font-size: 10px; }
        .tt .tcol-subj { width: 55px; background: #ecf0f1; font-weight: bold; color: #555; font-size: 10px; }
        .evt {
            display: inline-block; padding: 2px 4px; border-radius: 3px; color: white;
            font-size: 9px; white-space: nowrap;
        }
        .evt.math { background: #e74c3c; }
        .evt.chinese { background: #3498db; }
        .evt.physics { background: #f39c12; }
        .evt.chemistry { background: #9b59b6; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .footer {
            text-align: center; margin-top: 15px; padding-top: 10px;
            border-top: 1px solid #ecf0f1; color: #95a5a6; font-size: 11px;
        }
        .footer p:first-child { font-size: 13px; color: #2c3e50; margin-bottom: 3px; }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 10px; }
        }
        @media (max-width: 480px) {
            .container { padding: 10px; }
            h1 { font-size: 18px; }
            .stats span { font-size: 10px; }
            .stats strong { font-size: 13px; }
            .cal-day .day-label { font-size: 10px; }
            .cal-day .ev { font-size: 7px; }
            .tt th, .tt td { padding: 3px 1px; font-size: 9px; }
        }
    </style>
</head>

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        if (tab === 'calendar') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-calendar').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-weekly').classList.add('active');
        }
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        const firstDay = new Date(2026, 6, 1);
        const startDow = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
        const startDate = new Date(2026, 6, 1 - startDow);
        const dayMap = {};
        DATA.schedule.forEach(d => { dayMap[d.date] = d; });

        let html = '';
        // Column headers (no weekday names, just numbers)
        html += '<div class="col-header">一</div>';
        html += '<div class="col-header">二</div>';
        html += '<div class="col-header">三</div>';
        html += '<div class="col-header">四</div>';
        html += '<div class="col-header">五</div>';
        html += '<div class="col-header">六</div>';
        html += '<div class="col-header">日</div>';

        for (let i = 0; i < 6 * 7; i++) {
            const d = new Date(startDate);
            d.setDate(d.getDate() + i);
            if (d.getMonth() !== 6 || d.getFullYear() !== 2026) {
                html += '<div class="cal-day empty"></div>';
                continue;
            }
            const ds = d.toISOString().slice(0, 10);
            const dayInfo = dayMap[ds];
            const isWeekend = d.getDay() === 0 || d.getDay() === 6;

            html += '<div class="cal-day">';
            html += `<div class="day-label${isWeekend ? ' weekend' : ''}">${d.getDate()}</div>`;

            if (dayInfo) {
                dayInfo.events.forEach(ev => {
                    const cls = ev.subject === '数学' ? 'math' : ev.subject === '语文' ? 'chinese' : ev.subject === '物理' ? 'physics' : 'chemistry';
                    html += `<div class="ev ${cls}" title="${ev.description}">${ev.emoji} ${ev.time}</div>`;
                });
            }
            html += '</div>';
        }
        grid.innerHTML = html;
    }

    function getTimePeriod(timeStr) {
        const hour = parseInt(timeStr.split(':')[0]);
        if (hour < 12) return 'morning';
        if (hour < 18) return 'afternoon';
        return 'evening';
    }

    function renderWeekly() {
        const container = document.getElementById('weekly-container');
        const weekMap = {};
        DATA.schedule.forEach(d => {
            const dt = new Date(d.date);
            const dow = dt.getDay() === 0 ? 7 : dt.getDay();
            const weekNum = Math.ceil((dt.getDate() - dow + 1) / 7);
            if (!weekMap[weekNum]) weekMap[weekNum] = { dates: [], days: {} };
            weekMap[weekNum].dates.push(d.date);
            weekMap[weekNum].days[dow] = d;
        });

        const periods = [
            { key: 'morning', label: '☀️ 上午', cls: 'morning' },
            { key: 'afternoon', label: '🌤️ 下午', cls: 'afternoon' },
            { key: 'evening', label: '🌙 晚上', cls: 'evening' },
        ];

        const weekNums = Object.keys(weekMap).sort((a,b) => a - b);
        let html = '';

        weekNums.forEach(wk => {
            const info = weekMap[wk];
            const firstDate = info.dates[0].split('-')[2];
            const lastDate = info.dates[info.dates.length - 1].split('-')[2];

            html += `<div class="week-group"><div class="week-title">第 ${wk} 周 (${firstDate}日 - ${lastDate}日)</div>`;

            periods.forEach(period => {
                // Collect unique subjects in this period
                const periodSubjects = [];
                DATA.schedule.forEach(d => {
                    d.events.forEach(ev => {
                        if (getTimePeriod(ev.start_time) === period.key && !periodSubjects.includes(ev.subject)) {
                            periodSubjects.push(ev.subject);
                        }
                    });
                });

                if (periodSubjects.length === 0) return;

                // Sort by start time
                periodSubjects.sort((a, b) => {
                    const evA = DATA.schedule.flatMap(d => d.events).find(e => e.subject === a);
                    const evB = DATA.schedule.flatMap(d => d.events).find(e => e.subject === b);
                    return evA.start_time.localeCompare(evB.start_time);
                });

                html += `<div class="time-block"><div class="time-block-title ${period.cls}">${period.label}</div>`;
                html += '<table class="tt"><thead><tr><th class="tcol">时间</th>';
                for (let d = 1; d <= 7; d++) {
                    const names = ['','一','二','三','四','五','六','日'];
                    html += `<th>${names[d]}${d>=6?'⭐':''}</th>`;
                }
                html += '</tr></thead><tbody>';

                periodSubjects.forEach(subject => {
                    const ev = DATA.schedule.flatMap(d => d.events).find(e => e.subject === subject);
                    if (!ev) return;
                    const timeLabel = ev.time.split('-')[0];
                    const cls = subject === '数学' ? 'math' : subject === '语文' ? 'chinese' : subject === '物理' ? 'physics' : 'chemistry';
                    html += `<tr><td class="tcol-subj">${ev.emoji} ${subject}</td>`;
                    for (let d = 1; d <= 7; d++) {
                        const dayData = info.days[d];
                        if (dayData) {
                            const dayEv = dayData.events.find(e => e.subject === subject);
                            if (dayEv) {
                                html += `<td><span class="evt ${cls}">${dayEv.time}</span></td>`;
                            } else {
                                html += '<td></td>';
                            }
                        } else {
                            html += '<td></td>';
                        }
                    }
                    html += '</tr>';
                });

                html += '</tbody></table></div>';
            });

            html += '</div>';
        });

        container.innerHTML = html;
    }

    function updateStats() {
        const counts = { math: 0, chinese: 0, physics: 0, chemistry: 0 };
        DATA.schedule.forEach(d => {
            d.events.forEach(e => {
                if (e.subject === '数学') counts.math++;
                else if (e.subject === '语文') counts.chinese++;
                else if (e.subject === '物理') counts.physics++;
                else if (e.subject === '化学') counts.chemistry++;
            });
        });
        document.getElementById('math-count').textContent = counts.math;
        document.getElementById('chinese-count').textContent = counts.chinese;
        document.getElementById('physics-count').textContent = counts.physics;
        document.getElementById('chem-count').textContent = counts.chemistry;
        document.getElementById('total-days').textContent = DATA.total_days;
    }

    renderCalendar();
    renderWeekly();
    updateStats();
    </script>
