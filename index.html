<html lang="zh-CN">
<head>

    <title>妞妞高中衔接补课日程</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { overflow-x: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 12px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            color: white;
            text-align: center;
        }
        .header h1 { font-size: 22px; margin-bottom: 4px; }
        .header p { font-size: 13px; opacity: 0.85; }
        .header .stats {
            display: flex; justify-content: center; gap: 16px; margin-top: 12px; flex-wrap: wrap;
        }
        .header .stat { font-size: 12px; }
        .header .stat strong { font-size: 16px; display: block; }

        /* Day Card */
        .day-card {
            background: white;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .day-card.no-class {
            opacity: 0.4;
        }
        .day-header {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            background: #fafbfc;
            border-bottom: 1px solid #eee;
        }
        .day-date {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            min-width: 60px;
        }
        .day-weekday {
            font-size: 12px;
            color: #7f8c8d;
            margin-left: 8px;
        }
        .day-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: auto;
            font-weight: bold;
        }
        .day-badge.has-class { background: #e8f5e9; color: #2e7d32; }
        .day-badge.no-class { background: #f5f5f5; color: #bbb; }

        /* Period Section */
        .period {
            padding: 10px 14px;
            border-bottom: 1px solid #f0f0f0;
        }
        .period:last-child { border-bottom: none; }
        .period-label {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .period-label.morning { color: #e65100; }
        .period-label.afternoon { color: #1565c0; }
        .period-label.evening { color: #4a148c; }
        .period-label .dot {
            width: 8px; height: 8px; border-radius: 50%; display: inline-block;
        }
        .period-label.morning .dot { background: #ff9800; }
        .period-label.afternoon .dot { background: #2196f3; }
        .period-label.evening .dot { background: #9c27b0; }

        /* Class Item */
        .class-item {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 8px;
            margin-bottom: 4px;
            gap: 8px;
        }
        .class-item:last-child { margin-bottom: 0; }
        .class-item.math { background: #ffebee; }
        .class-item.chinese { background: #e3f2fd; }
        .class-item.physics { background: #fff3e0; }
        .class-item.chemistry { background: #f3e5f5; }

        .class-emoji { font-size: 18px; }
        .class-info { flex: 1; }
        .class-name { font-size: 13px; font-weight: bold; color: #2c3e50; }
        .class-desc { font-size: 11px; color: #7f8c8d; }
        .class-time {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        /* No class day */
        .no-class-msg {
            padding: 8px 14px;
            color: #bbb;
            font-size: 12px;
            text-align: center;
        }

        /* Monthly Calendar */
        .month-cal {
            background: white;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .summary-card {
            background: white;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .summary-card h3 {
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 10px;
            text-align: center;
        }
        .summary-row {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            gap: 10px;
        }
        .summary-row:last-child { border-bottom: none; }
        .summary-emoji { font-size: 20px; width: 28px; text-align: center; }
        .summary-info { flex: 1; }
        .summary-name { font-size: 14px; font-weight: bold; color: #2c3e50; }
        .summary-detail { font-size: 12px; color: #7f8c8d; margin-top: 2px; }
        .summary-badge {
            font-size: 12px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 12px;
            white-space: nowrap;
        }
        .summary-badge.math { background: #ffebee; color: #c62828; }
        .summary-badge.chinese { background: #e3f2fd; color: #1565c0; }
        .summary-badge.physics { background: #fff3e0; color: #e65100; }
        .summary-badge.chemistry { background: #f3e5f5; color: #6a1b9a; }
        .month-cal-title {
            font-size: 14px;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 8px;
        }
        .mc-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }
        .mc-head {
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            color: #7f8c8d;
            padding: 4px 0;
        }
        .mc-cell {
            border: 1px solid #f0f0f0;
            border-radius: 6px;
            padding: 3px;
            min-height: 50px;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .mc-cell.empty { border: none; background: transparent; }
        .mc-cell.sun-col { background: #fafafa; }
        .mc-cell.sat-col { background: #fffdf5; }
        .mc-cell.has-class { border-color: #ddd; }
        .mc-date {
            font-size: 10px;
            font-weight: bold;
            color: #2c3e50;
            line-height: 1;
            margin-bottom: 1px;
        }
        .mc-date.sun { color: #ccc; }
        .mc-date.sat { color: #e74c3c; }
        .mc-ev {
            font-size: 8px;
            color: white;
            border-radius: 2px;
            padding: 1px 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }
        .mc-ev.math { background: #e74c3c; }
        .mc-ev.chinese { background: #3498db; }
        .mc-ev.physics { background: #f39c12; }
        .mc-ev.chemistry { background: #9b59b6; }

        /* Footer */
        .footer {
            text-align: center;
            padding: 16px;
            color: #95a5a6;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            body { padding: 8px; }
            .header { padding: 16px; border-radius: 12px; }
            .header h1 { font-size: 18px; }
            .day-header { padding: 8px 10px; }
            .day-date { font-size: 14px; }
            .period { padding: 8px 10px; }
            .class-item { padding: 5px 8px; }
            .class-name { font-size: 12px; }
            .class-time { font-size: 11px; }
        }
    </style>
</head>

    const PERIODS = [
        { key: 'morning', label: '☀️ 上午', cls: 'morning', range: '09:00-11:59' },
        { key: 'afternoon', label: '🌤️ 下午', cls: 'afternoon', range: '12:00-18:00' },
        { key: 'evening', label: '🌙 晚上', cls: 'evening', range: '18:00-22:00' },
    ];

    function getPeriod(timeStr) {
        const h = parseInt(timeStr.split(':')[0]);
        if (h < 12) return 'morning';
        if (h < 18) return 'afternoon';
        return 'evening';
    }

    function renderMonthly() {
        const grid = document.getElementById('monthly-grid');
        const dayMap = {};
        DATA.schedule.forEach(d => { dayMap[d.date] = d; });

        // July 2026: July 1 = Wednesday (getDay=3)
        // Sunday of week before July 1 = June 28
        const sundayStart = new Date(2026, 5, 28); // June 28

        let html = '';
        // Headers: 日 一 二 三 四 五 六
        ['日','一','二','三','四','五','六'].forEach(h => {
            html += '<div class="mc-head">' + h + '</div>';
        });

        // 6 weeks x 7 days = 42 cells
        for (let i = 0; i < 42; i++) {
            const d = new Date(sundayStart);
            d.setDate(d.getDate() + i);
            const ds = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
            const inJuly = d.getMonth() === 6 && d.getFullYear() === 2026;
            const jsDow = d.getDay(); // 0=Sun, 6=Sat
            const dayInfo = dayMap[ds];
            const hasClass = inJuly && dayInfo && dayInfo.events.length > 0;

            if (!inJuly) {
                html += '<div class="mc-cell empty"></div>';
                continue;
            }

            const colClass = jsDow === 0 ? 'sun-col' : jsDow === 6 ? 'sat-col' : '';
            const dateClass = jsDow === 0 ? 'sun' : jsDow === 6 ? 'sat' : '';
            html += '<div class="mc-cell' + (hasClass ? ' has-class' : '') + ' ' + colClass + '">';
            html += '<div class="mc-date ' + dateClass + '">' + d.getDate() + '</div>';

            if (hasClass) {
                const sorted = [...dayInfo.events].sort((a, b) => a.start_time.localeCompare(b.start_time));
                sorted.forEach(ev => {
                    const cls = ev.subject === '数学' ? 'math' : ev.subject === '语文' ? 'chinese' : ev.subject === '物理' ? 'physics' : 'chemistry';
                    html += '<div class="mc-ev ' + cls + '" title="' + ev.description + ' ' + ev.time + '">' + ev.emoji + ev.subject + '</div>';
                });
            }
            html += '</div>';
        }
        grid.innerHTML = html;
    }

    function render() {
        const container = document.getElementById('schedule-list');
        let html = '';
        let totalSessions = 0;
        let totalHours = 0;

        // Build day map
        const dayMap = {};
        DATA.schedule.forEach(d => { dayMap[d.date] = d; });

        // Iterate all 31 days of July
        for (let day = 1; day <= 31; day++) {
            const dt = new Date(2026, 6, day);
            const dow = dt.getDay(); // 0=Sun, 1=Mon, ..., 6=Sat
            const ds = dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
            const dayNames = ['周日','周一','周二','周三','周四','周五','周六'];
            const dayInfo = dayMap[ds];

            const hasClass = dayInfo && dayInfo.events.length > 0;
            totalSessions += hasClass ? dayInfo.events.length : 0;

            html += '<div class="day-card' + (hasClass ? '' : ' no-class') + '">';

            // Header
            html += '<div class="day-header">';
            html += '<div class="day-date">7月' + day + '日</div>';
            html += '<div class="day-weekday">' + dayNames[dow] + '</div>';
            if (hasClass) {
                html += '<div class="day-badge has-class">有课</div>';
            } else {
                html += '<div class="day-badge no-class">休息</div>';
            }
            html += '</div>';

            if (hasClass) {
                // Group events by period
                const grouped = {};
                PERIODS.forEach(p => { grouped[p.key] = []; });
                dayInfo.events.forEach(ev => {
                    const p = getPeriod(ev.start_time);
                    if (grouped[p]) grouped[p].push(ev);
                });
                // Sort within each period by start time
                PERIODS.forEach(p => {
                    grouped[p.key].sort((a, b) => a.start_time.localeCompare(b.start_time));
                });

                PERIODS.forEach(p => {
                    if (grouped[p.key].length === 0) return;

                    html += '<div class="period">';
                    html += '<div class="period-label ' + p.cls + '">';
                    html += '<span class="dot"></span>' + p.label + ' <span style="color:#aaa;font-weight:normal;font-size:11px;">(' + p.range + ')</span>';
                    html += '</div>';

                    grouped[p.key].forEach(ev => {
                        const cls = ev.subject === '数学' ? 'math' : ev.subject === '语文' ? 'chinese' : ev.subject === '物理' ? 'physics' : 'chemistry';
                        totalHours += Math.round((parseInt(ev.end_time.split(':')[0])*60 + parseInt(ev.end_time.split(':')[1]) - parseInt(ev.start_time.split(':')[0])*60 - parseInt(ev.start_time.split(':')[1])) / 60 * 10) / 10;
                        html += '<div class="class-item ' + cls + '">';
                        html += '<div class="class-emoji">' + ev.emoji + '</div>';
                        html += '<div class="class-info">';
                        html += '<div class="class-name">' + ev.subject + '</div>';
                        html += '<div class="class-desc">' + ev.description + '</div>';
                        html += '</div>';
                        html += '<div class="class-time">' + ev.time + '</div>';
                        html += '</div>';
                    });

                    html += '</div>';
                });
            } else {
                html += '<div class="no-class-msg">🎉 今天休息，没有课程安排</div>';
            }

            html += '</div>';
        }

        container.innerHTML = html;
        document.getElementById('total-days').textContent = DATA.total_days;
        document.getElementById('total-sessions').textContent = totalSessions;
        document.getElementById('total-hours').textContent = totalHours.toFixed(1);
    }

    renderMonthly();
    render();
    </script>
