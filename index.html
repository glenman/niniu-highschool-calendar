            padding: 20px;
        }
        .container {
            max-width: 1100px;

        }
        .header { text-align: center; margin-bottom: 30px; }
        .logo { font-size: 50px; margin-bottom: 10px; }
        h1 { color: #2c3e50; font-size: 30px; margin-bottom: 5px; }
        .subtitle { color: #7f8c8d; font-size: 16px; margin-bottom: 15px; }
        .stats {
            display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;
            background: #f8f9fa; padding: 12px 20px; border-radius: 10px;
        }
        .stats span { font-size: 15px; }
        .stats strong { font-size: 18px; }

        /* Legend */
        .legend {
            background: #f8f9fa; padding: 15px 20px; border-radius: 10px; margin-bottom: 25px;
        }
        .legend h3 { margin-bottom: 10px; color: #2c3e50; font-size: 16px; }
        .legend-items { display: flex; flex-wrap: wrap; gap: 8px; }
        .legend-item {
            flex: 1; min-width: 200px; padding: 8px 12px; border-radius: 6px;
            border-left: 4px solid #ccc; background: white; font-size: 14px;
        }

        /* Calendar Grid */
        .calendar-wrapper { margin-bottom: 30px; }
        .calendar-header {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
            margin-bottom: 2px;
        }
        .calendar-header div {
            text-align: center; padding: 8px; font-weight: bold; color: #7f8c8d; font-size: 14px;
        }
        .calendar-body {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
        }
        .cal-day {
            min-height: 100px; border: 1px solid #ecf0f1; border-radius: 6px;
            padding: 4px; font-size: 12px; transition: all 0.2s;
        }
        .cal-day.empty { border: none; background: transparent; }
        .cal-day.has-events { cursor: default; }
        .cal-day:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .cal-day .day-num {
            font-weight: bold; color: #2c3e50; font-size: 13px; margin-bottom: 4px;
        }
        .cal-day .day-num.weekend { color: #e74c3c; }
        .cal-day .event-tag {
            display: block; padding: 2px 5px; border-radius: 3px; margin-bottom: 2px;
            font-size: 11px; color: white; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis;
        }
        .cal-day .event-tag.math { background: #e74c3c; }
        .cal-day .event-tag.chinese { background: #3498db; }
        .cal-day .event-tag.physics { background: #f39c12; }
        .cal-day .event-tag.chemistry { background: #9b59b6; }

        /* Weekly View */
        .weekly-section { margin-top: 20px; }
        .weekly-section h2 { color: #2c3e50; font-size: 22px; margin-bottom: 15px; text-align: center; }
        .week-group {
            background: #f8f9fa; border-radius: 12px; padding: 15px 20px; margin-bottom: 12px;
        }
        .week-title {
            font-weight: bold; color: #2c3e50; font-size: 15px; margin-bottom: 10px;
            padding-bottom: 5px; border-bottom: 2px solid #ddd;
        }
        .week-table { width: 100%; border-collapse: collapse; }
        .week-table th {
            background: #2c3e50; color: white; padding: 8px 6px; font-size: 13px; text-align: center;
        }
        .week-table td {
            padding: 6px; font-size: 12px; text-align: center; border-bottom: 1px solid #eee;
            vertical-align: top;
        }
        .week-table tr:last-child td { border-bottom: none; }
        .week-table .time-col { width: 80px; background: #ecf0f1; font-weight: bold; color: #555; }
        .event-cell {
            display: inline-block; padding: 3px 8px; border-radius: 4px; color: white;
            font-size: 11px; margin: 1px; white-space: nowrap;
        }
        .event-cell.math { background: #e74c3c; }
        .event-cell.chinese { background: #3498db; }
        .event-cell.physics { background: #f39c12; }
        .event-cell.chemistry { background: #9b59b6; }

        /* Print */
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 10px; }
        }
        @media (max-width: 768px) {
            .container { padding: 15px; }
            .cal-day { min-height: 70px; }
            .cal-day .event-tag { font-size: 9px; }
            .week-table th, .week-table td { padding: 4px 2px; font-size: 10px; }
        }

        .footer {
            text-align: center; margin-top: 30px; padding-top: 15px;
            border-top: 1px solid #ecf0f1; color: #95a5a6; font-size: 13px;
        }
        .footer p:first-child { font-size: 16px; color: #2c3e50; margin-bottom: 5px; }
    </style>

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        // July 2026 starts on Wednesday (day 2 in Mon=0 convention)
        // So Monday = Jul 6, Tuesday = Jul 7, Wednesday = Jul 1
        // Week 1: empty, empty, Jul1, Jul2, empty, empty, empty
        // Actually let's compute properly
        
        const firstDay = new Date(2026, 6, 1); // July 1
        const lastDay = new Date(2026, 6, 31); // July 31
        
        // JS getDay(): Sun=0, Mon=1, ..., Sat=6
        // We want Mon=0, ..., Sun=6
        const startDow = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1; // Wednesday = 2
        const totalDays = 31;
        
        // Build a map: date -> events
        const dayMap = {};
        DATA.schedule.forEach(d => {
            dayMap[d.date] = d;
        });
        
        // Calculate grid: we need cells from the Monday before July 1 to the Sunday after July 31
        const startDate = new Date(2026, 6, 1 - startDow); // Monday of the week containing July 1
        
        let html = '';
        for (let i = 0; i < 6 * 7; i++) { // max 6 weeks
            const d = new Date(startDate);
            d.setDate(d.getDate() + i);
            
            if (d.getMonth() !== 6 || d.getFullYear() !== 2026) {
                html += '<div class="cal-day empty"></div>';
                continue;
            }
            
            const ds = d.toISOString().slice(0, 10);
            const dayInfo = dayMap[ds];
            const isWeekend = d.getDay() === 0 || d.getDay() === 6;
            
            html += '<div class="cal-day';
            if (dayInfo) html += ' has-events';
            html += '">';
            html += `<div class="day-num${isWeekend ? ' weekend' : ''}">${d.getDate()}日 ${['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]}</div>`;
            
            if (dayInfo) {
                dayInfo.events.forEach(ev => {
                    const cls = ev.subject === '数学' ? 'math' : ev.subject === '语文' ? 'chinese' : ev.subject === '物理' ? 'physics' : 'chemistry';
                    html += `<span class="event-tag ${cls}">${ev.emoji} ${ev.time}</span>`;
                });
            }
            html += '</div>';
        }
        grid.innerHTML = html;
    }

    function renderWeekly() {
        const container = document.getElementById('weekly-container');
        const weekMap = {};
        
        DATA.schedule.forEach(d => {
            const dt = new Date(d.date);
            const dow = dt.getDay() === 0 ? 7 : dt.getDay(); // Mon=1..Sun=7
            const weekNum = Math.ceil((dt.getDate() - dow + 1) / 7);
            if (!weekMap[weekNum]) weekMap[weekNum] = { dates: [], days: {} };
            weekMap[weekNum].dates.push(d.date);
            weekMap[weekNum].days[dow] = d;
        });
        
        let html = '';
        const weekNums = Object.keys(weekMap).sort((a,b) => a - b);
        
        weekNums.forEach(wk => {
            const info = weekMap[wk];
            const firstDate = info.dates[0].split('-')[2];
            const lastDate = info.dates[info.dates.length - 1].split('-')[2];
            
            html += `<div class="week-group"><div class="week-title">第 ${wk} 周 (${firstDate}日 - ${lastDate}日)</div>`;
            html += '<table class="week-table"><thead><tr><th class="time-col">时间</th>';
            for (let d = 1; d <= 7; d++) {
                const names = ['','一','二','三','四','五','六','日'];
                html += `<th>${names[d]}${d >= 6 ? ' ⭐' : ''}</th>`;
            }
            html += '</tr></thead><tbody>';
            
            // Time slots
            const timeSlots = [
                { label: '09-11', subjects: ['语文'] },
                { label: '13-15', subjects: ['数学'] },
                { label: '16-18', subjects: ['物理'] },
                { label: '19-21', subjects: ['化学'] },
            ];
            
            timeSlots.forEach(slot => {
                html += `<tr><td class="time-col">${slot.label}</td>`;
                for (let d = 1; d <= 7; d++) {
                    const dayData = info.days[d];
                    if (dayData) {
                        const ev = dayData.events.find(e => slot.subjects.includes(e.subject));
                        if (ev) {
                            const cls = ev.subject === '数学' ? 'math' : ev.subject === '语文' ? 'chinese' : ev.subject === '物理' ? 'physics' : 'chemistry';
                            html += `<td><span class="event-cell ${cls}">${ev.emoji} ${ev.subject}</span></td>`;
                        } else {
                            html += '<td></td>';
                        }
                    } else {
                        html += '<td></td>';
                    }
                }
                html += '</tr>';
            });
            
            html += '</tbody></table></div>';
        });
        
        container.innerHTML = html;
    }

    function updateStats() {
        const counts = { math: 0, chinese: 0, physics: 0, chemistry: 0 };
        DATA.schedule.forEach(d => {
            d.events.forEach(e => {
                if (e.subject === '数学') counts.math++;
                else if (e.subject === '语文') counts.chinese++;
                else if (e.subject === '物理') counts.physics++;
                else if (e.subject === '化学') counts.chemistry++;
            });
        });
        document.getElementById('math-count').textContent = counts.math;
        document.getElementById('chinese-count').textContent = counts.chinese;
        document.getElementById('physics-count').textContent = counts.physics;
        document.getElementById('chem-count').textContent = counts.chemistry;
        document.getElementById('total-days').textContent = DATA.total_days;
    }

    renderCalendar();
    renderWeekly();
    updateStats();
    </script>
